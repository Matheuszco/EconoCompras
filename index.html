<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>EconoCompras</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f4f4f4;
}

/* TOPO */

.topo{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
background:linear-gradient(90deg,#5a2fd8,#ff7a00,#e11d48);
padding:20px;
color:white;
}

.logo{
width:55px;
}

/* CONTAINER */

.container{
max-width:1100px;
margin:auto;
padding:30px;
}

/* BUSCA */

.search-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
}

.filters{
display:flex;
gap:10px;
flex-wrap:wrap;
}

select{
flex:1;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
}

/* INFO */

.info{
margin:20px 0;
font-weight:bold;
}

/* RESULTADOS */

.resultados{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px;
}

.produto{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.08);
transition:0.2s;
}

.produto:hover{
transform:translateY(-4px);
}

.produto img{
width:100%;
height:140px;
object-fit:contain;
margin-bottom:10px;
}

/* TEXTO */

.nome{
font-weight:bold;
margin-bottom:5px;
}

.preco{
color:#e11d48;
font-weight:bold;
font-size:18px;
margin-top:6px;
}

/* TAGS */

.tag{
font-size:12px;
padding:4px 6px;
border-radius:5px;
color:white;
display:inline-block;
margin-bottom:5px;
}

.barato{
background:#22c55e;
}

.melhor{
background:#f59e0b;
}

.custo{
background:#3b82f6;
}

/* BOTÃO */

.botao{
margin-top:10px;
display:block;
text-align:center;
padding:10px;
background:#5a2fd8;
color:white;
border-radius:6px;
text-decoration:none;
font-weight:bold;
transition:0.2s;
}

.botao:hover{
background:#4322a8;
}

</style>
</head>

<body>

<header class="topo">
<img src="logo.png" class="logo">
<h1>EconoCompras</h1>
</header>

<div class="container">

<div class="search-box">

<input type="text" id="busca" placeholder="Pesquisar produto..." onkeyup="buscar()">

<div class="filters">

<select id="categoria" onchange="buscar()">
<option value="todos">Categoria</option>
<option value="eletronico">Eletrônicos</option>
<option value="casa">Casa</option>
<option value="roupa">Roupas</option>
</select>

<select id="loja" onchange="buscar()">

<option value="Shopee">Shopee</option>
<option value="Mercado Livre">Mercado Livre</option>
<option value="Magazine Luiza">Magazine Luiza</option>
</select>

<select id="preco" onchange="buscar()">
<option value="todos">Ordenar preço</option>
<option value="baixo">Mais barato</option>
<option value="alto">Mais caro</option>
</select>

</div>

</div>

<div class="info" id="info"></div>

<div class="resultados" id="resultados"></div>

</div>

<script>

}

function buscar(){

let texto = document.getElementById("busca").value.toLowerCase()
let categoria = document.getElementById("categoria").value
let loja = document.getElementById("loja").value
let precoFiltro = document.getElementById("preco").value

let resultados = produtos.filter(p=>{

if(texto && !p.nome.toLowerCase().includes(texto)) return false
if(categoria!="todos" && p.categoria!=categoria) return false
if(loja!="todas" && p.loja!=loja) return false

return true

})

if(precoFiltro=="baixo"){
resultados.sort((a,b)=>a.preco-b.preco)
}

if(precoFiltro=="alto"){
resultados.sort((a,b)=>b.preco-a.preco)
}

mostrar(resultados)

}

function mostrar(lista){

let div=document.getElementById("resultados")
let info=document.getElementById("info")

if(lista.length==0){
div.innerHTML="Nenhum produto encontrado"
info.innerHTML=""
return
}

info.innerHTML=lista.length+" resultados encontrados"

let maisBarato=Math.min(...lista.map(p=>p.preco))
let melhorAval=Math.max(...lista.map(p=>p.qualidade))
let melhorCusto=[...lista].sort((a,b)=> (b.qualidade/b.preco)-(a.qualidade/a.preco))[0]

div.innerHTML=""

lista.forEach(p=>{

let tag=""

if(p.preco==maisBarato){
tag='<div class="tag barato">Mais barato</div>'
}

if(p.qualidade==melhorAval){
tag='<div class="tag melhor">Melhor avaliado</div>'
}

if(p.nome==melhorCusto.nome){
tag='<div class="tag custo">Melhor custo-benefício</div>'
}

div.innerHTML+=`

<div class="produto">

${tag}

<img src="${p.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828843.png'">

<div class="nome">${p.nome}</div>

⭐ ${p.qualidade}

<div class="preco">R$ ${p.preco}</div>

<div>Loja: ${p.loja}</div>

<a href="${p.link}" target="_blank" class="botao">Ver oferta</a>

</div>

`

})

}

buscar()

</script>
