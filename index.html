<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>EconoCompras</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f4f4f4;
}

/* TOPO */

.topo{

display:flex;
align-items:center;
justify-content:center;
gap:15px;

background: linear-gradient(90deg,#5a2fd8,#ff7a00,#e11d48);

padding:20px;
color:white;

}

.logo{
width:60px;
}

.topo h1{
font-size:26px;
}

/* CONTAINER */

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

/* CAIXA DE BUSCA */

.search-box{

background:white;

padding:20px;

border-radius:10px;

box-shadow:0 4px 10px rgba(0,0,0,0.08);

margin-bottom:25px;

}

input{

width:100%;

padding:12px;

margin-bottom:15px;

border-radius:6px;

border:1px solid #ccc;

font-size:16px;

}

.filters{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-bottom:10px;

}

select{

flex:1;

padding:10px;

border-radius:6px;

border:1px solid #ccc;

}

/* BOTÃO */

button{

width:100%;

padding:12px;

background: linear-gradient(90deg,#5a2fd8,#ff7a00,#e11d48);

color:white;

border:none;

border-radius:6px;

font-size:16px;

cursor:pointer;

}

/* RESULTADOS */

.resultados{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(230px,1fr));

gap:15px;

}

.produto{

background:white;

padding:15px;

border-radius:10px;

box-shadow:0 3px 8px rgba(0,0,0,0.08);

transition:0.2s;

}

.produto:hover{

transform:translateY(-4px);

}

.nome{

font-weight:bold;

margin-bottom:5px;

}

.categoria{

font-size:13px;

color:#777;

}

.preco{

color:#e11d48;

font-weight:bold;

margin-top:5px;

}

.loja{

font-size:14px;

color:#555;

}

</style>
</head>

<body>

<header class="topo">

<img src="logo.png" class="logo">

<h1>EconoCompras</h1>

</header>

<div class="container">

<div class="search-box">

<input type="text" id="busca" placeholder="Pesquisar produto...">

<div class="filters">

<select id="categoria">
<option value="todos">Categoria</option>
<option value="eletronico">Eletrônicos</option>
<option value="casa">Casa</option>
<option value="roupa">Roupas</option>
</select>

<select id="preco">
<option value="todos">Ordenar preço</option>
<option value="baixo">Mais barato</option>
<option value="alto">Mais caro</option>
</select>

<select id="qualidade">
<option value="todos">Qualidade</option>
<option value="4">4 estrelas ou mais</option>
<option value="3">3 estrelas ou mais</option>
</select>

<select id="nacionalidade">
<option value="todos">Origem</option>
<option value="br">Brasil</option>
<option value="importado">Importado</option>
</select>

</div>

<button onclick="buscar()">Buscar</button>

</div>

<div class="resultados" id="resultados"></div>

</div>

<script>

const produtos = [

{nome:"Mouse Gamer RGB Pro", categoria:"eletronico", preco:120, qualidade:4.6, nacionalidade:"importado", loja:"Amazon"},
{nome:"Mouse Gamer RGB X900", categoria:"eletronico", preco:95, qualidade:4.3, nacionalidade:"importado", loja:"Shopee"},
{nome:"Mouse Gamer RGB Elite", categoria:"eletronico", preco:150, qualidade:4.8, nacionalidade:"importado", loja:"Mercado Livre"},

{nome:"Teclado Mecânico Gamer Pro", categoria:"eletronico", preco:320, qualidade:4.8, nacionalidade:"importado", loja:"Amazon"},
{nome:"Teclado Mecânico RGB X", categoria:"eletronico", preco:270, qualidade:4.5, nacionalidade:"importado", loja:"Shopee"},

{nome:"Headset Gamer Surround", categoria:"eletronico", preco:210, qualidade:4.4, nacionalidade:"importado", loja:"Amazon"},
{nome:"Headset Gamer Pro Sound", categoria:"eletronico", preco:250, qualidade:4.6, nacionalidade:"importado", loja:"Shopee"},

{nome:"Monitor 24 Gamer", categoria:"eletronico", preco:950, qualidade:4.7, nacionalidade:"importado", loja:"Amazon"},
{nome:"Monitor 24 Full HD", categoria:"eletronico", preco:820, qualidade:4.4, nacionalidade:"importado", loja:"Mercado Livre"},

{nome:"Garrafa Térmica Inox", categoria:"casa", preco:89, qualidade:4.5, nacionalidade:"br", loja:"Amazon"},
{nome:"Garrafa Térmica Premium", categoria:"casa", preco:120, qualidade:4.7, nacionalidade:"importado", loja:"Shopee"},

{nome:"Liquidificador Turbo", categoria:"casa", preco:140, qualidade:4.3, nacionalidade:"br", loja:"Amazon"},
{nome:"Liquidificador Power Mix", categoria:"casa", preco:180, qualidade:4.6, nacionalidade:"importado", loja:"Shopee"},

{nome:"Air Fryer Digital", categoria:"casa", preco:350, qualidade:4.7, nacionalidade:"importado", loja:"Amazon"},
{nome:"Air Fryer Compact", categoria:"casa", preco:280, qualidade:4.3, nacionalidade:"br", loja:"Mercado Livre"},

{nome:"Camiseta Básica", categoria:"roupa", preco:45, qualidade:4.1, nacionalidade:"br", loja:"Shopee"},
{nome:"Camiseta Premium", categoria:"roupa", preco:70, qualidade:4.5, nacionalidade:"importado", loja:"Amazon"},

{nome:"Tênis Esportivo Runner", categoria:"roupa", preco:260, qualidade:4.6, nacionalidade:"importado", loja:"Amazon"},
{nome:"Tênis Esportivo Confort", categoria:"roupa", preco:210, qualidade:4.3, nacionalidade:"br", loja:"Mercado Livre"}

]

function buscar(){

let texto = document.getElementById("busca").value.toLowerCase()
let categoria = document.getElementById("categoria").value
let precoFiltro = document.getElementById("preco").value
let qualidadeFiltro = document.getElementById("qualidade").value
let nacionalidade = document.getElementById("nacionalidade").value

let resultados = produtos.filter(p => {

if(texto && !p.nome.toLowerCase().includes(texto)) return false
if(categoria != "todos" && p.categoria != categoria) return false
if(qualidadeFiltro != "todos" && p.qualidade < qualidadeFiltro) return false
if(nacionalidade != "todos" && p.nacionalidade != nacionalidade) return false

return true

})

if(precoFiltro == "baixo"){
resultados.sort((a,b)=> a.preco - b.preco)
}

if(precoFiltro == "alto"){
resultados.sort((a,b)=> b.preco - a.preco)
}

mostrar(resultados)

}

function mostrar(lista){

let div = document.getElementById("resultados")

if(lista.length == 0){
div.innerHTML = "Nenhum produto encontrado."
return
}

div.innerHTML=""

lista.forEach(p => {

div.innerHTML += `
<div class="produto">

<div class="nome">${p.nome}</div>

<div class="categoria">${p.categoria}</div>

⭐ ${p.qualidade}

<div class="preco">R$ ${p.preco}</div>

<div class="loja">Loja: ${p.loja}</div>

</div>
`

})

}

</script>

</body>
</html>
